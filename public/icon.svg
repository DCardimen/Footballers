<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- PLACEHOLDER APP ICON — replace with final art (see docs/COMMERCIAL.md §Icons).
       Full-bleed background + key art kept within the central ~66% maskable safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182338"/>
      <stop offset="0.55" stop-color="#0d141d"/>
      <stop offset="1" stop-color="#070b12"/>
    </linearGradient>
    <linearGradient id="ball" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a8622f"/>
      <stop offset="1" stop-color="#7a4a24"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2c451"/>
      <stop offset="1" stop-color="#c9962a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- subtle field yard lines -->
  <g opacity="0.10" stroke="#eef2f7" stroke-width="6">
    <line x1="0" y1="330" x2="1024" y2="330"/>
    <line x1="0" y1="512" x2="1024" y2="512"/>
    <line x1="0" y1="694" x2="1024" y2="694"/>
  </g>
  <!-- football, centered within maskable safe zone -->
  <g transform="translate(512 470) rotate(-24)">
    <ellipse cx="0" cy="0" rx="235" ry="150" fill="url(#ball)" stroke="#3a2412" stroke-width="10"/>
    <path d="M-150 0 H150" stroke="#f2efe4" stroke-width="16" stroke-linecap="round"/>
    <g stroke="#f2efe4" stroke-width="12" stroke-linecap="round">
      <line x1="-90" y1="-26" x2="-90" y2="26"/>
      <line x1="-45" y1="-30" x2="-45" y2="30"/>
      <line x1="0" y1="-32" x2="0" y2="32"/>
      <line x1="45" y1="-30" x2="45" y2="30"/>
      <line x1="90" y1="-26" x2="90" y2="26"/>
    </g>
    <ellipse cx="-70" cy="-52" rx="120" ry="46" fill="#ffffff" opacity="0.12"/>
  </g>
  <!-- wordmark -->
  <text x="512" y="800" text-anchor="middle" font-family="Oswald, Arial Narrow, sans-serif"
        font-weight="700" font-size="150" letter-spacing="10" fill="url(#gold)">RIB</text>
  <text x="512" y="862" text-anchor="middle" font-family="Barlow Condensed, Arial, sans-serif"
        font-weight="600" font-size="40" letter-spacing="12" fill="#93a0b1">RUNNING IT BACK</text>
</svg>
