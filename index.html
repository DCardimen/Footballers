<!-- v114: the splash film is deliberately NOT preloaded from here. A <link rel=preload as=video>
     did start the fetch a few ms sooner, but it is a fetch no script can take back, and the two
     paths that refuse the film — prefers-reduced-motion and ?noFilmV114 — then paid ~1.4MB for a
     file they never show (a media= query on the link is not honoured early enough to lean on).
     #splash is the first element in the body, so the preload scanner reaches the <source>s inside
     #splashFilm on its own and almost nothing is lost. v114check counts the bytes on both paths. -->
<script>
/* ===== v112 A THE CHASE IS ALWAYS READY — the warm, in the first breath of the head =====
 * The loading screen is drawn from the v91 field sheet, and until now nothing asked for that
 * sheet until v94's own <script> ran: a hundred kilobytes of document and every stylesheet in
 * the head first (an inline script waits on the styles above it). Cold on a throttled link that
 * put the request on the wire at 1.23s and the first animated frame at 3.09s — a loading screen
 * that spends the load loading.
 * So the sheet is asked for HERE, before the CSS, before the parser has even seen the splash: the
 * bytes leave at ~40ms (1.5Mbps: 0.18s), and on any link worth the name the whole picture has
 * landed before v94's script runs at all. v94's load() ADOPTS these two promises instead of
 * starting its own — the page still makes exactly two requests for the sheet in the whole session
 * — the cells are cut and recoloured once into module scope, and every later loading scene (the
 * live game's loader most of all) starts on the frame it is mounted: 3.09s -> 2.15s cold on that
 * same throttled link, and 63ms for a second scene. window.__V112_A is the stopwatch;
 * ?noWarmV112 puts the old cold path back for a comparison.
 * What this CANNOT buy is the main thread: the megabytes of inline bundle below compile in one
 * task, and no rAF loop outruns that (the stall is on __V112_A.mounts[n].maxGapMs). Which is why
 * the loader's own bar was moved onto the compositor — see @keyframes splashLoad. */
(function () {
  var A = window.__V112_A = { warmMs: null, mapMs: null, imgMs: null, sheetMs: null, engineMs: null,
    cellsMs: null, cells: 0, firstFrameMs: null, mounts: [], sheetReqs: 0, adopted: false, warm: false };
  var now = function () { try { return Math.round(performance.now()); } catch (e) { return 0; } };
  try { if (/[?&]noWarmV112\b/.test(location.search)) return; } catch (e) {}
  function url(p) {
    try { return new URL((window.__RIB_ASSET_ROOT || 'public/') + p, document.baseURI || location.href).href; }
    catch (e) { return './public/' + p; }
  }
  try {
    A.warmMs = now(); A.warm = true;
    var img = new Image(); img.decoding = 'async';
    try { img.fetchPriority = 'high'; } catch (e) {}                                   // an off-document Image is a LOW priority fetch by default: this is the picture the user is about to look at
    var imgP = new Promise(function (res) { img.onload = function () { A.imgMs = now(); res(img); }; img.onerror = function () { A.imgMs = now(); res(null); }; });
    img.src = window.__RIB_FIELD_V91 || url('rib_field_v91.png'); A.sheetReqs++;
    var mapP = null;
    try { mapP = fetch(url('rib_field_v91.json'), { priority: 'high' }); A.sheetReqs++; } catch (e) { mapP = null; }
    mapP = (mapP || Promise.resolve(null)).then(function (r) { A.mapMs = now(); return r && r.ok ? r.json() : null; }).catch(function () { A.mapMs = now(); return null; });
    window.__RIB_WARM_V112 = { img: img, imgP: imgP, mapP: mapP };
  } catch (e) { window.__RIB_WARM_V112 = null; }
})();
</script>

<script>
/* v114: the film's source, chosen and set in the same breath as the element is parsed.
 * It is NOT a <source> in the markup and NOT a <link rel=preload> in the head, because both of
 * those start a fetch the page cannot take back — and the two paths that refuse the film,
 * prefers-reduced-motion and ?noFilmV114, would then pay ~1.4MB for a file they never show (on a
 * fast link the transfer completes before any script could abort it). Deciding here instead costs
 * a few milliseconds against the preload scanner and buys a guarantee. H.264 first: it is what the
 * phones this game is played on decode. The VP9/WebM sibling is for a browser that cannot — which
 * includes Chromium built without proprietary codecs, and so is also the only reason v114check can
 * watch a frame arrive. Exactly one of the two is ever fetched. */
(function () {
  try {
    var v = document.getElementById('splashFilm'); if (!v) return;
    var rm = false; try { rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    var off = false; try { off = /[?&]noFilmV114\b/.test(location.search); } catch (e) {}
    if (rm || off) { v.preload = 'none'; return; }                       // not shown, so not fetched
    var mp4 = ''; try { mp4 = v.canPlayType('video/mp4; codecs="avc1.4d401f"'); } catch (e) {}
    var root = window.__RIB_ASSET_ROOT || './public/';
    v.src = root + (mp4 ? 'rib_film_v116.mp4' : 'rib_film_v116.webm');
  } catch (e) {}
})();
</script>

<script>

// error surfacing
window.addEventListener('error', function(e){
  var s=document.querySelector('#splash .splash-title b');
  if(s) s.textContent='ERROR: '+(e.message||'unknown');
});
window.addEventListener('unhandledrejection', function(e){
  var s=document.querySelector('#splash .splash-title b');
  if(s) s.textContent='ERROR: '+((e.reason&&e.reason.message)||e.reason||'unknown');
});
// localStorage shim for sandboxed iframes
(function(){
  var ok=false;
  try{ window.localStorage.getItem('__probe'); ok=true; }catch(e){}
  if(!ok){
    var mem=new Map();
    var shim={
      getItem:function(k){ k=String(k); return mem.has(k)?mem.get(k):null; },
      setItem:function(k,v){ mem.set(String(k),String(v)); },
      removeItem:function(k){ mem.delete(String(k)); },
      clear:function(){ mem.clear(); },
      key:function(i){ var a=Array.from(mem.keys()); return a[i]!==undefined?a[i]:null; }
    };
    Object.defineProperty(shim,'length',{get:function(){return mem.size;}});
    try{ Object.defineProperty(window,'localStorage',{value:shim,configurable:true}); }catch(e){}
    window.__GRIDIRON_MEMORY_STORAGE__=true;
  }
})();
// confirm/prompt are suppressed in sandboxed iframes (always false/null),
// which would block new careers and resets. Auto-accept confirm: every
// confirm in this game is behind an explicit, labeled button tap.
(function(){
  var origConfirm = window.confirm, origPrompt = window.prompt;
  window.confirm = function(msg){
    var t0 = Date.now(), r;
    try{ r = origConfirm ? origConfirm.call(window, msg) : undefined; }catch(e){ r = undefined; }
    if (r === true) return true;
    // real dialogs block for human-scale time; an instant false/undefined
    // means the sandbox suppressed the dialog — treat as accepted, since
    // every confirm here sits behind an explicit labeled button tap
    if (Date.now() - t0 < 50) return true;
    return false;
  };
  window.prompt = function(msg, def){
    try{ var r = origPrompt ? origPrompt.call(window, msg, def) : null; return r === undefined ? null : r; }
    catch(e){ return null; }
  };
})();
/* ===== v101 ONE ASSET ROOT — every sheet answers to the same URL =====
 * The sheets had drifted into two conventions: the older ones asked for "/rib_x.png"
 * (the server root) and the newer ones for "./public/rib_x.png" (the folder the deploy
 * actually ships). Only one of those can be right at a time, and neither is right
 * everywhere — a project Pages site lives under a sub-path, so the server root is a
 * different origin folder entirely, and `vite build` flattens public/ into dist/, so the
 * folder disappears. Both mistakes fail the same silent way: the Image() 404s, onerror
 * shrugs, and the drawn players never register — a field of blanks.
 * One resolver now answers for all of them, against the DOCUMENT, so the same string
 * works served from a root, from a sub-path, from dist/ and from the Capacitor shell.
 * Overridable per-asset by the __RIB_* globals exactly as before. */
(function () {
  var base = null;
  window.__RIB_ASSET_ROOT = window.__RIB_ASSET_ROOT || 'public/';
  window.__RIB_ASSET = function (p) {
    p = String(p || '');
    if (/^(data:|blob:|https?:|\/\/)/.test(p)) return p;         // already absolute: hand it back
    if (base == null) { try { base = document.baseURI || location.href; } catch (e) { base = location.href; } }
    try { return new URL(window.__RIB_ASSET_ROOT + p.replace(/^\.?\//, ''), base).href; }
    catch (e) { return './' + window.__RIB_ASSET_ROOT + p; }
  };
})();

</script>

<style>
.pregame-v1513{position:fixed;inset:0;z-index:900;background:radial-gradient(circle at 50% 0,#203048,#050910 68%);overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 24px);color:var(--chalk)}
.pregame-panel-v1513{max-width:720px;margin:0 auto}
/* v20 pregame odds panel */
.pregame-odds-v20{margin:12px 14px 4px;padding:12px 14px;border:1px solid rgba(240,187,69,.35);border-radius:12px;background:rgba(13,20,32,.75)}
.odds-head-v20{display:flex;align-items:center;gap:14px}
.odds-big-v20{font:800 34px Oswald;line-height:1;display:flex;flex-direction:column}
.odds-big-v20 small{font:700 9px Oswald;letter-spacing:2px;color:var(--chalk-dim)}
.odds-lab-v20{display:flex;flex-direction:column;gap:2px}
.odds-lab-v20 b{font:700 17px Oswald;letter-spacing:.5px}
.odds-lab-v20 small{font:400 11px system-ui;color:var(--chalk-dim)}
.odds-bar-v20{height:8px;border-radius:5px;background:rgba(224,72,79,.3);overflow:hidden;margin:9px 0 10px}
.odds-bar-v20 i{display:block;height:100%;background:linear-gradient(90deg,#2f7d4a,#57e07a);border-radius:5px}
.odds-notes-v20{display:flex;flex-direction:column;gap:5px}
.odds-notes-v20 div{font:400 12px system-ui;line-height:1.35;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.04)}
.odds-notes-v20 .g{color:#a9e5bb;border-left:3px solid #2f7d4a}
.odds-notes-v20 .b{color:#f2b3ae;border-left:3px solid #a04040}.pregame-head-v1513{text-align:center;padding:18px 8px 16px}.pregame-kicker-v1513{font:600 10px Oswald;letter-spacing:3px;color:var(--gold)}.pregame-title-v1513{font:700 31px Oswald;line-height:1.05;margin-top:5px}.pregame-sub-v1513{font-size:14px;color:var(--chalk-dim);margin-top:6px}.pregame-match-v1513{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin:8px 0 14px}.pregame-team-v1513{padding:12px 8px;border-radius:14px;background:linear-gradient(180deg,#1b2d42,#0b111a);border:1px solid #ffffff17;text-align:center;min-width:0}.pregame-team-v1513.away{background:linear-gradient(180deg,#422026,#160b0e)}.pregame-team-v1513 b{display:block;font:700 17px Oswald;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pregame-team-v1513 small{display:block;font:10px Oswald;letter-spacing:1.5px;color:var(--chalk-dim);margin-top:3px}.pregame-emblem-v44{display:block!important;width:44px;height:44px;margin:0 auto 7px;filter:drop-shadow(0 2px 3px #0009)}.pregame-vs-v1513{font:700 18px Oswald;color:var(--gold)}.pregame-lists-v1513{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pregame-card-v1513{background:linear-gradient(180deg,#172231,#0a1018);border:1px solid var(--line);border-radius:16px;overflow:hidden}.pregame-card-v1513 h3{font:700 14px Oswald;letter-spacing:1.3px;padding:11px 12px;background:#ffffff08;border-bottom:1px solid #ffffff10}.pregame-player-v1513{display:grid;grid-template-columns:25px 1fr auto;gap:8px;align-items:center;padding:10px 11px;border-bottom:1px solid #ffffff0b}.pregame-player-v1513:last-child{border-bottom:0}.pregame-rank-v1513{font:700 13px Oswald;color:var(--gold)}.pregame-player-v1513 b{display:block;font:600 14px Oswald;line-height:1.05}.pregame-player-v1513 small{display:block;font-size:11px;color:var(--chalk-dim);margin-top:2px}.pregame-ovr-v1513{text-align:right;font:700 20px Oswald}.pregame-ovr-v1513 small{font:9px Oswald;letter-spacing:1px;color:var(--chalk-dim)}.pregame-actions-v1513{display:flex;gap:9px;margin-top:14px}.pregame-actions-v1513 .btn{margin:0}.pregame-actions-v1513 .secondary{max-width:145px}@media(max-width:520px){.pregame-lists-v1513{grid-template-columns:1fr}.pregame-head-v1513{padding-top:8px}.pregame-title-v1513{font-size:27px}}

<style>
.pv13-ovl{position:fixed;inset:0;z-index:1200;background:radial-gradient(circle at 50% 0,#1a2740,#05080f 70%);overflow:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px calc(env(safe-area-inset-bottom) + 20px);color:var(--chalk);font-family:Oswald,system-ui,sans-serif}
.pv13-panel{max-width:640px;margin:0 auto}
.pv13-head{text-align:center;padding:8px 6px 14px}
.pv13-kick{font:600 10px Oswald;letter-spacing:3px;color:var(--gold)}
.pv13-title{font:700 30px Oswald;line-height:1.05;margin:2px 0 6px}
.pv13-sub{font:400 13px system-ui;color:var(--chalk-dim);max-width:460px;margin:0 auto;line-height:1.4}
.pv13-body{display:flex;flex-direction:column;gap:11px;margin:4px 0 14px}
.pv13-row{background:#0f1622;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:9px 11px}
.pv13-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pv13-name{font:700 14px Oswald;letter-spacing:.5px}
.pv13-val{font:800 18px Oswald;color:var(--gold)}
.pv13-track{display:flex;align-items:center;gap:9px}
.pv13-step{flex:0 0 32px;height:32px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:#1b2636;color:#fff;font:700 20px Oswald;line-height:1;cursor:pointer}
.pv13-step:disabled{opacity:.3;cursor:default}
.pv13-bar{position:relative;flex:1;height:22px;border-radius:11px;background:linear-gradient(90deg,#26405f,#402638);overflow:hidden;display:flex;align-items:center}
.pv13-bar b{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#2f7d4a,#f0bb45);opacity:.5}
.pv13-bar i{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6);z-index:2}
.pv13-lo,.pv13-hi{position:relative;z-index:1;font:600 9px Oswald;letter-spacing:.5px;color:rgba(255,255,255,.75);padding:0 8px}
.pv13-hi{margin-left:auto}
.pv13-foot{position:sticky;bottom:0;background:linear-gradient(180deg,transparent,#05080f 26%);padding:10px 0 4px;text-align:center}
.pv13-pts{font:600 13px Oswald;letter-spacing:1px;color:var(--chalk)}
.pv13-pts b{color:var(--gold);font-size:17px}
.pv13-boosts{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 10px;min-height:20px}
.pv13-chip{font:700 10px Oswald;letter-spacing:.5px;padding:3px 8px;border-radius:20px;background:#16202e;border:1px solid rgba(255,255,255,.1)}
.pv13-chip.up{color:#7fe0a0;border-color:#2f7d4a66}
.pv13-chip.dn{color:#ff9a9a;border-color:#a0404066}
