<!-- v114: the splash film is deliberately NOT preloaded from here. A <link rel=preload as=video>
     did start the fetch a few ms sooner, but it is a fetch no script can take back, and the two
     paths that refuse the film — prefers-reduced-motion and ?noFilmV114 — then paid ~1.4MB for a
     file they never show (a media= query on the link is not honoured early enough to lean on).
     #splash is the first element in the body, so the preload scanner reaches the <source>s inside
     #splashFilm on its own and almost nothing is lost. v114check counts the bytes on both paths. -->
<script>
/* ===== v112 A THE CHASE IS ALWAYS READY — the warm, in the first breath of the head =====
 * The loading screen is drawn from the v91 field sheet, and until now nothing asked for that
 * sheet until v94's own <script> ran: a hundred kilobytes of document and every stylesheet in
 * the head first (an inline script waits on the styles above it). Cold on a throttled link that
 * put the request on the wire at 1.23s and the first animated frame at 3.09s — a loading screen
 * that spends the load loading.
 * So the sheet is asked for HERE, before the CSS, before the parser has even seen the splash: the
 * bytes leave at ~40ms (1.5Mbps: 0.18s), and on any link worth the name the whole picture has
 * landed before v94's script runs at all. v94's load() ADOPTS these two promises instead of
 * starting its own — the page still makes exactly two requests for the sheet in the whole session
 * — the cells are cut and recoloured once into module scope, and every later loading scene (the
 * live game's loader most of all) starts on the frame it is mounted: 3.09s -> 2.15s cold on that
 * same throttled link, and 63ms for a second scene. window.__V112_A is the stopwatch;
 * ?noWarmV112 puts the old cold path back for a comparison.
 * What this CANNOT buy is the main thread: the megabytes of inline bundle below compile in one
 * task, and no rAF loop outruns that (the stall is on __V112_A.mounts[n].maxGapMs). Which is why
 * the loader's own bar was moved onto the compositor — see @keyframes splashLoad. */
(function () {
  var A = window.__V112_A = { warmMs: null, mapMs: null, imgMs: null, sheetMs: null, engineMs: null,
    cellsMs: null, cells: 0, firstFrameMs: null, mounts: [], sheetReqs: 0, adopted: false, warm: false };
  var now = function () { try { return Math.round(performance.now()); } catch (e) { return 0; } };
  try { if (/[?&]noWarmV112\b/.test(location.search)) return; } catch (e) {}
  function url(p) {
    try { return new URL((window.__RIB_ASSET_ROOT || 'public/') + p, document.baseURI || location.href).href; }
    catch (e) { return './public/' + p; }
  }
  try {
    A.warmMs = now(); A.warm = true;
    var img = new Image(); img.decoding = 'async';
    try { img.fetchPriority = 'high'; } catch (e) {}                                   // an off-document Image is a LOW priority fetch by default: this is the picture the user is about to look at
    var imgP = new Promise(function (res) { img.onload = function () { A.imgMs = now(); res(img); }; img.onerror = function () { A.imgMs = now(); res(null); }; });
    img.src = window.__RIB_FIELD_V91 || url('rib_field_v91.png'); A.sheetReqs++;
    var mapP = null;
    try { mapP = fetch(url('rib_field_v91.json'), { priority: 'high' }); A.sheetReqs++; } catch (e) { mapP = null; }
    mapP = (mapP || Promise.resolve(null)).then(function (r) { A.mapMs = now(); return r && r.ok ? r.json() : null; }).catch(function () { A.mapMs = now(); return null; });
    window.__RIB_WARM_V112 = { img: img, imgP: imgP, mapP: mapP };
  } catch (e) { window.__RIB_WARM_V112 = null; }
})();
</script>

<script>
/* v114: the film's source, chosen and set in the same breath as the element is parsed.
 * It is NOT a <source> in the markup and NOT a <link rel=preload> in the head, because both of
 * those start a fetch the page cannot take back — and the two paths that refuse the film,
 * prefers-reduced-motion and ?noFilmV114, would then pay ~1.4MB for a file they never show (on a
 * fast link the transfer completes before any script could abort it). Deciding here instead costs
 * a few milliseconds against the preload scanner and buys a guarantee. H.264 first: it is what the
 * phones this game is played on decode. The VP9/WebM sibling is for a browser that cannot — which
 * includes Chromium built without proprietary codecs, and so is also the only reason v114check can
 * watch a frame arrive. Exactly one of the two is ever fetched. */
(function () {
  try {
    var v = document.getElementById('splashFilm'); if (!v) return;
    var rm = false; try { rm = window.matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) {}
    var off = false; try { off = /[?&]noFilmV114\b/.test(location.search); } catch (e) {}
    if (rm || off) { v.preload = 'none'; return; }                       // not shown, so not fetched
    var mp4 = ''; try { mp4 = v.canPlayType('video/mp4; codecs="avc1.4d401f"'); } catch (e) {}
    var root = window.__RIB_ASSET_ROOT || './public/';
    v.src = root + (mp4 ? 'rib_film_v116.mp4' : 'rib_film_v116.webm');
  } catch (e) {}
})();
</script>

<script>

// error surfacing
window.addEventListener('error', function(e){
  var s=document.querySelector('#splash .splash-title b');
  if(s) s.textContent='ERROR: '+(e.message||'unknown');
});
window.addEventListener('unhandledrejection', function(e){
  var s=document.querySelector('#splash .splash-title b');
  if(s) s.textContent='ERROR: '+((e.reason&&e.reason.message)||e.reason||'unknown');
});
// localStorage shim for sandboxed iframes
(function(){
  var ok=false;
  try{ window.localStorage.getItem('__probe'); ok=true; }catch(e){}
  if(!ok){
    var mem=new Map();
    var shim={
      getItem:function(k){ k=String(k); return mem.has(k)?mem.get(k):null; },
      setItem:function(k,v){ mem.set(String(k),String(v)); },
      removeItem:function(k){ mem.delete(String(k)); },
      clear:function(){ mem.clear(); },
      key:function(i){ var a=Array.from(mem.keys()); return a[i]!==undefined?a[i]:null; }
    };
    Object.defineProperty(shim,'length',{get:function(){return mem.size;}});
    try{ Object.defineProperty(window,'localStorage',{value:shim,configurable:true}); }catch(e){}
    window.__GRIDIRON_MEMORY_STORAGE__=true;
  }
})();
// v150 A: the sandbox confirm/prompt auto-accept shim is gone — every confirm and prompt in the game is
// the in-app ribDialog (src/26-platform.js) now, which a sandboxed iframe does not suppress.
/* ===== v101 ONE ASSET ROOT — every sheet answers to the same URL =====
 * The sheets had drifted into two conventions: the older ones asked for "/rib_x.png"
 * (the server root) and the newer ones for "./public/rib_x.png" (the folder the deploy
 * actually ships). Only one of those can be right at a time, and neither is right
 * everywhere — a project Pages site lives under a sub-path, so the server root is a
 * different origin folder entirely, and `vite build` flattens public/ into dist/, so the
 * folder disappears. Both mistakes fail the same silent way: the Image() 404s, onerror
 * shrugs, and the drawn players never register — a field of blanks.
 * One resolver now answers for all of them, against the DOCUMENT, so the same string
 * works served from a root, from a sub-path, from dist/ and from the Capacitor shell.
 * Overridable per-asset by the __RIB_* globals exactly as before. */
(function () {
  var base = null;
  window.__RIB_ASSET_ROOT = window.__RIB_ASSET_ROOT || 'public/';
  window.__RIB_ASSET = function (p) {
    p = String(p || '');
    if (/^(data:|blob:|https?:|\/\/)/.test(p)) return p;         // already absolute: hand it back
    if (base == null) { try { base = document.baseURI || location.href; } catch (e) { base = location.href; } }
    try { return new URL(window.__RIB_ASSET_ROOT + p.replace(/^\.?\//, ''), base).href; }
    catch (e) { return './' + window.__RIB_ASSET_ROOT + p; }
  };
})();

</script>
